name: nexusauth-direct

services:
  db:
    image: postgres:16-alpine
    env_file:
      - path: ./postgres.env
        format: raw
    volumes:
      - database:/var/lib/postgresql/data
      - type: bind
        source: ./production-init.sql
        target: /docker-entrypoint-initdb.d/001-schema.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sso:
    image: nexusauth-host:latest
    env_file:
      - path: ./sso.env
        format: raw
    ports:
      - "5100:8080"
    volumes:
      - ./sso.appsettings.json:/app/appsettings.json:ro
      - signing-data:/app/App_Data
      - sso-protection:/root/.aspnet/DataProtection-Keys
      - ./signing:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  admin-api:
    image: nexusauth-workbench-api:latest
    env_file:
      - path: ./workbench.env
        format: raw
    volumes:
      - ./workbench.appsettings.json:/app/appsettings.Production.json:ro
      - workbench-protection:/root/.aspnet/DataProtection-Keys
    networks:
      - default
      - workbench-proxy
    depends_on:
      db:
        condition: service_healthy
      sso:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: nexusauth-workbench-dashboard:latest
    ports:
      - "5560:80"
    networks:
      - workbench-edge
      - workbench-proxy
    depends_on:
      admin-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
  # The Dashboard nginx is the only workload on this network besides the
  # Workbench API, which trusts X-Forwarded-For only from this subnet. Keep it
  # equal to Security:KnownNetworks in the mounted Workbench appsettings.
  workbench-proxy:
    internal: true
    ipam:
      config:
        - subnet: ${NEXUSAUTH_WORKBENCH_PROXY_SUBNET:-172.30.56.0/28}
  # Publishes the Dashboard port; the API is not attached to it, so nginx can
  # reach the API only over workbench-proxy.
  workbench-edge:

volumes:
  database:
  signing-data:
  sso-protection:
  workbench-protection:
