name: Build NexusHost Docker Image CI

on:
   workflow_dispatch:
    inputs:
      version:
        description: Build NexusHost Docker Image CI (for example, 18790997531/nexusauth:1.0.8)
        required: true
        type: string
  permissions:
    contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag 18790997531/nexusauth:"${{ inputs.version }}"
