name: Build and Push NexusAuth Workbench API Docker Image
run-name: Build and push NexusAuth Workbench API:${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (for example, 1.0.8 or latest)'
        required: true
        type: string

permissions:
  contents: read

env:
  DOCKER_IMAGE: 18790997531/nexusauth-workbench-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Validate image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Invalid Docker tag. Use 1-128 letters, digits, underscores, dots or hyphens; start with a letter, digit or underscore.'
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Configure these credentials in the repository's GitHub Actions secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push NexusAuth Workbench API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: admin/src/NexusAuth.Workbench.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}
          cache-from: type=gha,scope=nexusauth-workbench-api
          cache-to: type=gha,scope=nexusauth-workbench-api,mode=max
