services:
  db:
    image: postgres:16-alpine
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER:-nexusauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusauth_dev_password}
      POSTGRES_DB: postgres
    volumes:
      - nexusauth-db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/000-postgres-init.sh:ro
      - ./production-init.sql:/opt/nexusauth-init/production-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:33210:5432"
    restart: unless-stopped

  sso:
    build:
      context: .
      dockerfile: src/NexusAuth.Host/Dockerfile
    environment:
      TZ: Asia/Shanghai
      ASPNETCORE_ENVIRONMENT: ${NEXUSAUTH_SSO_ENVIRONMENT:-Development}
    volumes:
      - ${NEXUSAUTH_HOST_APPSETTINGS_FILE:-./docker/host.appsettings.json}:/app/appsettings.${NEXUSAUTH_SSO_ENVIRONMENT:-Development}.json:ro
      - nexusauth-signing-key:/app/App_Data
      - nexusauth-sso-keys:/root/.aspnet/DataProtection-Keys
      - ./logs/sso:/app/logs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5100:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  admin-api:
    build:
      context: .
      dockerfile: admin/src/NexusAuth.Workbench.Api/Dockerfile
    environment:
      TZ: Asia/Shanghai
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    depends_on:
      db:
        condition: service_healthy
      sso:
        condition: service_healthy
    volumes:
      - ${NEXUSAUTH_WORKBENCH_APPSETTINGS_FILE:-./docker/workbench.appsettings.json}:/app/appsettings.${ASPNETCORE_ENVIRONMENT:-Production}.json:ro
      - nexusauth-admin-keys:/root/.aspnet/DataProtection-Keys
      - ./logs/workbench:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: admin/src/NexusAuth.Workbench.Dashboard/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      TZ: Asia/Shanghai
    depends_on:
      admin-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5560:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  nexusauth-db-data:
  nexusauth-signing-key:
  nexusauth-sso-keys:
  nexusauth-admin-keys:
