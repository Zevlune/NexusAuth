apisix:
  node_listen: [9180, 5100]
  enable_admin: true
  # APISIX Admin API is the only supported writer for encrypted plugin fields.
  # APISIX Dashboard 3.0 is intentionally not deployed because it writes JSON
  # directly to etcd and cannot use this encryption pipeline.
  data_encryption:
    enable_encrypt_fields: true
    keyring:
      - "${{APISIX_DATA_ENCRYPTION_KEY}}"

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_listen:
      ip: 127.0.0.1
      port: 9181
    allow_admin:
      - 127.0.0.1/32
    admin_key:
      - name: admin
        key: "${{APISIX_ADMIN_KEY}}"
        role: admin
  etcd:
    host:
      - "http://apisix-etcd:2379"
    prefix: "/apisix"
    timeout: 30
