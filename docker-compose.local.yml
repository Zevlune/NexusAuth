# Optional local preview data. Does not replace or clear existing volumes.
services:
  admin-api:
    # Explicit opt-in for isolated local HTTP preview only.
    volumes:
      - ${NEXUSAUTH_WORKBENCH_APPSETTINGS_FILE:-./docker/workbench.local.appsettings.json}:/app/appsettings.${ASPNETCORE_ENVIRONMENT:-Production}.json:ro
  sso:
    volumes:
      - ./docker/host.local.appsettings.json:/app/appsettings.${NEXUSAUTH_SSO_ENVIRONMENT:-Development}.json:ro
  db:
    volumes:
      - ./docker/local-demo-seed.sql:/docker-entrypoint-initdb.d/010-local-demo.sql:ro
