name: webauthnnexusauth

services:
  webauthn-nexusauth-db:
    image: postgres:16-alpine
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${WEBAUTHN_NEXUSAUTH_POSTGRES_USER:-webauthnnexusauth}
      POSTGRES_PASSWORD: ${WEBAUTHN_NEXUSAUTH_POSTGRES_PASSWORD:-webauthnnexusauth_dev_password}
      POSTGRES_DB: postgres
      WEBAUTHN_NEXUSAUTH_DATABASE: WebAuthnNexusAuth
    volumes:
      - webauthnnexusauth-db-data:/var/lib/postgresql/data
      - ./docker/webauthn-nexusauth-postgres-init.sh:/docker-entrypoint-initdb.d/000-webauthn-nexusauth-init.sh:ro
      - ./production-init.sql:/opt/webauthn-nexusauth-init/production-init.sql:ro
      - ./webauthn-production-init.sql:/opt/webauthn-nexusauth-init/webauthn-production-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d WebAuthnNexusAuth"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:56783:5432"
    restart: unless-stopped

  webauthn-nexusauth-sso:
    build:
      context: .
      dockerfile: src/NexusAuth.Host/Dockerfile
    environment:
      TZ: Asia/Shanghai
      ASPNETCORE_ENVIRONMENT: ${WEBAUTHN_NEXUSAUTH_ENVIRONMENT:-Development}
    volumes:
      - ${WEBAUTHN_NEXUSAUTH_APPSETTINGS_FILE:-./docker/webauthn-host.appsettings.json}:/app/appsettings.${WEBAUTHN_NEXUSAUTH_ENVIRONMENT:-Development}.json:ro
      - webauthnnexusauth-signing-key:/app/App_Data
      - webauthnnexusauth-data-protection-keys:/root/.aspnet/DataProtection-Keys
      - ./logs/webauthn-nexusauth:/app/logs
    depends_on:
      webauthn-nexusauth-db:
        condition: service_healthy
    ports:
      - "5200:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  webauthnnexusauth-db-data:
  webauthnnexusauth-signing-key:
  webauthnnexusauth-data-protection-keys:
